apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-demo
  template:
    metadata:
      labels:
        app: argocd-demo
    spec:
      containers:
        - name: web
          image: leejoeun/argocd-demo:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
